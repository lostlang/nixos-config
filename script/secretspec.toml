[project]
name = "nixos-scripts"
revision = "1.0"

[providers.bao-approle]
uri = "openbao:///config?auth=approle"

[profiles.default]
ADGUARDHOME_DOMAIN = { description = "AdGuard Home domain", ref = { item = "shared/domain", field = "adguardhome" }, required = true }
MATRIX_DOMAIN = { description = "Matrix domain", ref = { item = "shared/domain", field = "matrix" }, required = true }
VAULTWARDEN_DOMAIN = { description = "Vaultwarden domain", ref = { item = "shared/domain", field = "vaultwarden" }, required = true }
REMNAWAVE_SUBSCRIPTION_DOMAIN = { description = "Remnawave subscription domain", ref = { item = "shared/domain", field = "remnawave_subscription" }, required = true }
REMNAWAVE_PANEL_IP = { description = "Remnawave panel IP address", ref = { item = "shared/remnawave", field = "panel_ip" }, required = true }
REMNAWAVE_SECRET_KEY = { description = "Remnawave secret key", ref = { item = "shared/remnawave", field = "secret_key" }, required = true }

REMNAWAVE_NODE_DOMAIN = { description = "Remnawave node domain", required = true }
REMNAWAVE_APP_SECRET = { description = "Remnawave panel application secret", required = true }
REMNAWAVE_API_TOKEN = { description = "Remnawave panel API token", required = true }
TUWUNEL_REGISTRATION_TOKEN = { description = "Tuwunel registration token", required = true }
VAULTWARDEN_ADMIN_TOKEN = { description = "Vaultwarden administrator token", required = true }

[profiles.vps15358d36]
REMNAWAVE_NODE_DOMAIN = { ref = { item = "server/vps15358d36", field = "remnawave_node_domain" } }
REMNAWAVE_APP_SECRET = { ref = { item = "server/vps15358d36", field = "remnawave_app_secret" } }
REMNAWAVE_API_TOKEN = { ref = { item = "server/vps15358d36", field = "remnawave_api_token" } }
TUWUNEL_REGISTRATION_TOKEN = { ref = { item = "server/vps15358d36", field = "tuwunel_registration_token" } }
VAULTWARDEN_ADMIN_TOKEN = { ref = { item = "server/vps15358d36", field = "vaultwarden_admin_token" } }

[profiles.vps72c411b0]
REMNAWAVE_NODE_DOMAIN = { ref = { item = "server/vps72c411b0", field = "remnawave_node_domain" } }
REMNAWAVE_APP_SECRET = { ref = { item = "server/vps72c411b0", field = "remnawave_app_secret" } }
REMNAWAVE_API_TOKEN = { ref = { item = "server/vps72c411b0", field = "remnawave_api_token" } }
TUWUNEL_REGISTRATION_TOKEN = { ref = { item = "server/vps72c411b0", field = "tuwunel_registration_token" } }
